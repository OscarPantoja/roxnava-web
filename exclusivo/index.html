<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contenido exclusivo de Rox Nava y enlaces oficiales"
    />
    <title>Rox Nava | Contenido Exclusivo</title>
    <link
      rel="icon"
      type="image/png"
      href="../assets/images/marca/RN_monograma.png"
    />
    <link
      rel="apple-touch-icon"
      href="../assets/images/marca/RN_monograma.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bpmf+Huninn&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <header class="page-header">
      <a
        href="../"
        class="page-header__back"
        aria-label="Volver al sitio principal"
      >
        <img
          src="../assets/icons/back_logo.svg"
          alt="Flecha de retroceso"
          class="page-header__back-icon"
        />

        <span>Volver</span>
      </a>
      <img
        src="../assets/images/marca/RN_logo.webp"
        alt="Logotipo Rox Nava"
        class="page-header__logo"
      />
    </header>
    <section class="exclusive-header">
      <div class="exclusive-card">
        <img
          src="../assets/images/rox/Rox_img_exclusivo.webp"
          alt="Foto de Rox Nava"
          class="card__image"
        />
      </div>
    </section>
    <section class="exclusive-intro">
      <h1 class="exclusive-intro__title">Contenido exclusivo</h1>

      <div class="exclusive-intro__divider"></div>

      <p class="exclusive-intro__description">
        Fotos, videos, lives y contenido exclusivo disponible únicamente en mis
        canales oficiales.
      </p>
      <a href="#social-links" class="hero__button" id="hero-button">
        Acceder al contenido
      </a>
      <a
        href="#social-links"
        class="hero__scroll"
        aria-label="Ir a enlaces principales"
      >
        <span class="hero__chevron"></span>
      </a>
    </section>
    <section id="social-links" class="social-links">
      <div class="social-links__container">
        <a
          class="social-card"
          data-platform="onlyfans"
          href="https://onlyfans.com/roxnava"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visitar perfil de OnlyFans"
        >
          <div class="social-card__icon">
            <img
              class="social-card__icon-image"
              src="../assets/icons/gem_white_logo.svg"
              alt="logo de OnlyFans"
              aria-hidden="true"
            />
          </div>

          <div class="social-card__content">
            <h2 class="social-card__title">OnlyFans</h2>
            <p class="social-card__description">Fotos y videos exclusivos.</p>
          </div>

          <span class="social-card__arrow" aria-hidden="true"></span>
        </a>

        <a
          class="social-card"
          data-platform="telegram"
          href="https://t.me/+AaMxjqg3aEI2OWRh"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visitar grupo de Telegram"
        >
          <div class="social-card__icon">
            <img
              class="social-card__icon-image"
              src="../assets/icons/send_white_logo.svg"
              alt="logo de Telegram"
              aria-hidden="true"
            />
          </div>

          <div class="social-card__content">
            <h2 class="social-card__title">Telegram</h2>
            <p class="social-card__description">
              Únete a mi grupo de Telegram.
            </p>
          </div>

          <span class="social-card__arrow" aria-hidden="true"></span>
        </a>
      </div>
    </section>
    <footer class="footer">
      <div class="footer__content">
        <img
          class="footer__logo"
          src="../assets/images/marca/RN_logo.webp"
          alt="Rox Nava"
        />

        <p class="footer__text">Todos los enlaces oficiales.</p>

        <small class="footer__copyright">
          © 2026 Rox Nava. Todos los derechos reservados.
        </small>
      </div>
    </footer>
    <!-- Scripts -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-97QXMS26HQ"
    ></script>

    <script src="../assets/js/analytics.js"></script>
  </body>
</html>
